<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">NEOVIM CONFIG — a little flow for your editor</title>
  <desc id="desc">
    Animated project nameplate. LAZYVIM / LUA / CATPPUCCIN. Artwork is
    decorative and respects reduced-motion preferences.
  </desc>
  <style>
    .bob,
    .cloud {
      animation: float 3s ease-in-out infinite;
    }
    .tail {
      animation: twinkle 2s ease-in-out infinite;
    }
    .twinkle,
    .blink {
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .orbit {
      transform-origin: 146px 109px;
      animation: orbit 35s linear infinite;
    }
    .pulse {
      animation: twinkle 2s ease-in-out infinite;
    }
    .bar {
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    @keyframes twinkle {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }
    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
  <rect width="1200" height="300" rx="18" fill="#111d1a" />
  <rect
    x="14"
    y="14"
    width="1172"
    height="272"
    rx="10"
    fill="none"
    stroke="#3b4b40"
  />
  <circle cx="58" cy="56" r="5" fill="#a6da95" />
  <g font-family="ui-monospace,monospace">
    <text x="76" y="61" font-size="13" letter-spacing="3" fill="#a6da95">
      JOSE SUSTAITA / THE WORKBENCH
    </text>
    <text
      x="54"
      y="145"
      font-size="53"
      font-weight="700"
      letter-spacing="-2"
      fill="#f5f1e6"
    >
      NEOVIM CONFIG
    </text>
    <text x="58" y="191" font-size="20" fill="#bbc8bb">
      a little flow for your editor
    </text>
    <path d="M58 221h680" stroke="#3b4b40" />
    <text x="58" y="255" font-size="13" letter-spacing="2" fill="#a6da95">
      LAZYVIM / LUA / CATPPUCCIN
    </text>
  </g>
  <g transform="translate(840 26)">
    <g fill="none" stroke="#a6da95" stroke-width="4" stroke-linecap="round">
      <rect x="25" y="25" width="250" height="190" rx="14" />
      <path
        d="M25 64h250M45 44h2m15 0h2m15 0h2M60 105l22 18-22 18m40 0h55M58 178h150"
      />
      <path class="blink" d="M170 107v37" stroke-width="12" />
      <path class="twinkle" d="M221 111v25m-12-12h25" />
    </g>
  </g>
</svg>
