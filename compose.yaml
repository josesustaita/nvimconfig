name: jose-neovim
services:
  nvim:
    build: .
    stdin_open: true
    tty: true
    init: true
    environment:
      TERM: ${TERM:-xterm-256color}
      NVIM_REDUCED_MOTION: ${NVIM_REDUCED_MOTION:-0}
    volumes:
      - "${NVIM_WORKSPACE:-.}:/workspace"
      - nvim-data:/home/node/.local/share/nvim
      - nvim-state:/home/node/.local/state/nvim
      - nvim-cache:/home/node/.cache/nvim
volumes:
  nvim-data:
  nvim-state:
  nvim-cache:
